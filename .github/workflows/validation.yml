name: Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 同一分支重复触发时取消前次运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== 基础检查 ====================
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # 绑定层（crates/*/src/python）由 `#[cfg(feature = "python")]` 门控，普通
  # clippy/test 编译不到；这个 job 专门编译校验绑定代码 + 其单测，
  # 避免 pyo3 API 漂移（如 0.20→0.28）到发版才暴露。
  # 注：pyo3 的 extension-module 不链接 libpython，故只能编译校验，
  # 无法 `cargo test --features python`（链接阶段必然失败，详见
  # docs/zh/about/contributing.md 的「Python 绑定层」小节）。
  python-lint:
    name: Clippy (python feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          # pyo3 的 build script 需要一个解释器来推导 cfgs；版本与
          # pyproject.toml 的 requires-python(>=3.13,<3.15) 对齐。
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-lint
      - name: Run clippy (python feature)
        env:
          PYO3_PYTHON: python3
        run: cargo clippy --workspace --all-targets --features python --locked -- -D warnings

  # 绑定层的行为测试（tests/python，142 个 pytest 用例）。这是唯一会真正编译
  # 扩展模块并安装运行的一环，因此同时覆盖「wheel 能否构建」这一风险。
  # 3 个需要 testnet 凭据/网络的脚本由 tests/python/conftest.py 的 collect_ignore 排除。
  # 本地等价命令：make python-develop && make python-test
  python-test:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-test
      - name: Build & install extension (dev profile)
        env:
          PYO3_PYTHON: python3
        run: |
          python -m venv .venv
          . .venv/bin/activate
          # jsonschema 是测试依赖（tests/python/test_run_50bar_mock.py 校验 trajectory
          # JSON Schema），与 pyproject 的 dev extra 保持一致
          pip install maturin pytest jsonschema
          maturin develop
      - name: Run pytest
        run: |
          . .venv/bin/activate
          python -m pytest tests/python -q

  # ==================== 测试矩阵 ====================
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Run unit tests
        # 注：不使用 --all-features，避免 python feature 连带拉入
        # axon-rl/hpo/walk-forward/distributed 的绑定层与 onnx/tch 等重依赖。
        # --locked:tch 依赖的 zip 0.6.x 已被 yanked,需锁文件中的版本。
        run: cargo test --workspace --locked

  # ==================== 编译验证 ====================
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-build
      - name: Build (default features)
        run: cargo build --workspace --locked
      - name: Build (no default features)
        run: cargo build --workspace --no-default-features --locked

  # ==================== MSRV 检查 ====================
  msrv:
    name: MSRV Check (1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV compatibility
        # 注：不使用 --all-features，避免 python feature 连带拉入
        # axon-rl/hpo/walk-forward/distributed 的绑定层与 onnx/tch 等重依赖。
        # --locked:tch 依赖的 zip 0.6.x 已被 yanked,需锁文件中的版本。
        run: cargo check --workspace --locked

  # ==================== 文档构建 ====================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        # 注：不使用 --all-features，避免 python feature 连带拉入绑定层与
        # onnx/tch 等重依赖。默认 features 已能覆盖 6 个 crate 的 lib 文档。
        # --locked:tch 依赖的 zip 0.6.x 已被 yanked,需锁文件中的版本。
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  # ==================== 中英 docs 结构漂移检测(0.8.0 Phase 1.2) ====================
  docs-drift:
    name: Docs drift check (zh vs en)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check structural alignment between docs/zh/ and docs/en/
        # 翻译内容差异属预期行为;本 job 只检测结构性 drift:
        # - .md 文件列表是否完全对齐
        # - 子目录结构是否对称
        # - mkdocs.yml / mkdocs-en.yml nav 引用是否全部命中
        run: bash scripts/check-docs-drift.sh

  # ==================== 安全审计 ====================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        # Phase 0 阶段不阻断合并，仅警告
        run: cargo audit
        continue-on-error: true

  # ==================== 最终状态汇总 ====================
  success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fmt
      - clippy
      - python-lint
      - python-test
      - test
      - build
      - msrv
      - docs
      - docs-drift
    steps:
      - name: Check critical jobs
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] ||
             [[ "${{ needs.clippy.result }}" != "success" ]] ||
             [[ "${{ needs.python-lint.result }}" != "success" ]] ||
             [[ "${{ needs.python-test.result }}" != "success" ]] ||
             [[ "${{ needs.test.result }}" != "success" ]] ||
             [[ "${{ needs.build.result }}" != "success" ]] ||
             [[ "${{ needs.docs-drift.result }}" != "success" ]]; then
            echo "Critical jobs failed!"
            exit 1
          fi
          echo "All critical checks passed!"
